<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Mouse Escape Game</title>
        <style>
            body {
                margin: 0;
                background-color: #eb0b7b;  
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                color: rgb(18, 134, 143);
            }
            .game-container {
                position: relative;
                width: 900px;
                height: 700px;
                box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
                border: 4px solid #e94560;
                border-radius: 10px;
                overflow: hidden;
            }
            canvas {
                display: block;
            }
            .menu-overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(22, 33, 62, 0.94);
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 16px;
                padding: 20px;
                box-sizing: border-box;
            }
            h1 {
                font-size: 46px;
                color: #e94560;
                margin: 0 0 15px 0;
                text-shadow: 2px 2px 8px black;
                letter-spacing: 2px;
            }
            .btn {
                width: 240px;
                padding: 12px;
                font-size: 20px;
                font-weight: bold;
                color: white;
                background-color: #0f3460;
                border: 2px solid #e94560;
                border-radius: 8px;
                cursor: pointer;
                transition: 0.2s;
            }
            .btn:hover {
                background-color: #e94560;
                transform: scale(1.05);
            }
            .start-btn {
                background-color: #e94560;
            }
            .hidden {
                display: none !important;
            }
            .option-row {
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                width: 390px;   
                color: white;
                font-size: 18px;
                font-weight: bold;
            }
                .option-row .btn {
                    width: 190px;
                    padding: 10px;
                    font-size: 16px;
                }
                input[type="range"] {
                    width: 190px;
                    accent-color: #e94560;
                    cursor: pointer;
                }
            
        </style>
    </head>
    <body>
        <div class="game-container">
            <canvas id="escapeGame" width="900" height="700"></canvas>
            <div id="mainMenu" class="menu-overlay">
                <h1>Mouse Escape</h1>
                <p id="highScoreDisplay" style="font-size: 20px; color: #ffd700; margin: 0 0 10px 0; font-weight: bold;">High Score: 0</p>
                <p style="font-size: 15px; color: #ddd; max-width: 450px; text-align: center; margin: 0 0 10px 0;">
                    Mission: Grab the golden key for extra time and reach the safe house before the timer ends!
                </p>
                <button class="btn start-btn" onclick="startGame()">start Game</button>
                <button class="btn" id="diffBtn" onclick="changeDifficulty()">Difficulty: Easy</button>
                <button class="btn" onclick="openTab('optionsMenu')">Options</button>
                <button class="btn" onclick="openTab('exitTab')">Exit</button>
            </div>
            <div id="optionsMenu" class="menu-overlay hidden">
                <h1>Options</h1>
                <div class="option-row">
                    <span>Sound:</span>
                    <button class="btn" id="soundBtn" onclick="toggleSound()">Sound: ON</button>
                </div>
                <div class="option-row">
                    <span>Volume:</span>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.3" oninput="changeVolume()">
                </div>
                <div class="option-row">
                    <span>Mouse Color:</span>
                    <button class="btn" id="mouseColorBtn" onclick="changeMouseColor()">Color: Gray</button>
                </div>
                <div class="option-row">
                    <span>Arena Theme:</span>
                    <button class="btn" id="themeBtn" onclick="changeTheme()">Theme: Light</button>
                </div>
                <button class="btn start-btn" onclick="openTab('mainMenu')">Back</button>
            </div>
            <div id="exitTab" class="menu-overlay hidden">
                <h1>GoodBye!</h1>
                <p style="font-size: 18px; color: #ccc;">Thanks for playing Mouse Escape</p>
                <button class="btn" onclick="openTab('mainMenu')">Return to Menu</button>
            </div>
            <div id="pauseMenu" class="menu-overlay hidden">
                <h1>Paused</h1>
                <button class="btn start-btn" onclick="togglePause()">Resume</button>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
